name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/cd.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build test
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: 13.222.139.218   #public IP
          username: ubuntu
          key: ${{ secrets.UI_EC2_SSH_KEY }}
          source: "frontend/."
          target: "~/deploy-ui"

      - name: Build and Run with Docker Compose on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.222.139.218
          username: ubuntu
          key: ${{ secrets.UI_EC2_SSH_KEY }}
          script: |
            cd ~/deploy-ui
            docker rm -f ui-rest || true
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker image prune -f

      - name: Send Telegram Notification (Success)
        uses: appleboy/telegram-action@master
        if: success()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Frontend Deployment Successful!
            Application: ui-rest
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Actor: ${{ github.actor }}

      - name: Send Telegram Notification (Failure)
        uses: appleboy/telegram-action@master
        if: failure()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Frontend Deployment FAILED!
            Application: ui-rest
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Actor: ${{ github.actor }}
            Please check the GitHub Actions logs immediately!